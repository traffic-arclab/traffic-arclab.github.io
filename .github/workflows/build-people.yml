name: Build People page

on:
  push:
    branches: [main]
    paths:
      - 'data/people.json'
      - 'scripts/build_people.py'
  workflow_dispatch:       # "Run workflow" button in the Actions tab

permissions:
  contents: write
  pages: write

concurrency:
  group: build-people
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rebuild people.html
        run: python scripts/build_people.py

      - name: Commit changes
        id: commit
        run: |
          if git diff --quiet; then
            echo "people.html is already up to date."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add people.html
          git commit -m "Rebuild People page"
          git pull --rebase
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Pushes made with GITHUB_TOKEN do not start a new Pages build on their own
      - name: Rebuild GitHub Pages
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages build request failed; it will run on the next push."
