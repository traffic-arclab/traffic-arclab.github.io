    <circle cx="640" cy="192" r="5"/><circle cx="560" cy="150" r="4"/><circle cx="700" cy="250" r="4"/><circle cx="440" cy="210" r="3"/>
  </g>
  <g fill="#7fb7db">
    <circle cx="598" cy="52" r="10" opacity=".22"/><circle cx="640" cy="192" r="10" opacity=".22"/>
  </g>
  <!-- Field of view of the telescope -->
  <g stroke="#8fafc8" stroke-width="1" opacity=".45" stroke-dasharray="3 8">
    <path d="M423 283 343 210M437 297 362 226"/>
  </g>
