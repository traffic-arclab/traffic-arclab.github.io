    <path d="M512 74 598 52 678 108 640 192 560 150 512 74M560 150 640 192 700 250M598 52 560 150M678 108 700 250"/>
    <path d="M440 210 512 74M440 210 560 150" stroke-dasharray="4 9"/>
  </g>
  <g fill="#a9c3d4">
