<svg xmlns="http://www.w3.org/2000/svg" width="720" height="620" viewBox="0 0 720 620" fill="none" aria-hidden="true">
  <!-- Scaled and raised so that the whole observatory stays above the fade at the bottom of the page title band -->
  <g transform="translate(158 -30) scale(.78)">
