    <path d="M272 186 300 150 334 176 272 186M300 150 318 132"/>
  </g>
  <g fill="#7fb7db">
    <circle cx="300" cy="166" r="70" opacity=".08"/>
    <circle cx="300" cy="150" r="5"/><circle cx="272" cy="186" r="4" opacity=".8"/><circle cx="334" cy="176" r="4" opacity=".8"/><circle cx="318" cy="132" r="3" opacity=".7"/>
    <circle cx="300" cy="150" r="11" opacity=".22"/>
  </g>
  <!-- Observatory: dome with an open slit, telescope and base -->
  <g stroke="#8fafc8" stroke-width="1.5" opacity=".6" stroke-linejoin="round">
