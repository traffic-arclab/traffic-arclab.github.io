    <path d="M396 400c1.2 8 4.8 11.6 12.8 12.8-8 1.2-11.6 4.8-12.8 12.8-1.2-8-4.8-11.6-12.8-12.8 8-1.2 11.6-4.8 12.8-12.8Z" opacity=".4"/>
  </g>
  <g fill="#a9c3d4" opacity=".7">
    <circle cx="480" cy="300" r="2"/><circle cx="660" cy="290" r="2"/><circle cx="380" cy="80" r="2"/><circle cx="700" cy="30" r="2"/>
