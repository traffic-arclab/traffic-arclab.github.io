  <g stroke="#8fafc8" stroke-width="1.3" opacity=".5">
    <rect x="300" y="210" width="40" height="40" rx="11"/><path d="m314 221 14 9-14 9Z"/>
    <rect x="640" y="190" width="38" height="38" rx="10"/><path d="M650 203h18a3 3 0 0 1 3 3v8a3 3 0 0 1-3 3h-10l-6 5v-5h-2a3 3 0 0 1-3-3v-8a3 3 0 0 1 3-3Z"/>
    <rect x="390" y="440" width="38" height="38" rx="10"/><circle cx="409" cy="459" r="9"/><path d="M409 450v9l6 4"/>
    <rect x="96" y="220" width="36" height="36" rx="10"/><path d="M106 238a8 8 0 1 0 16 0 8 8 0 1 0-16 0M114 230v16"/>
