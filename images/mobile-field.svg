<svg xmlns="http://www.w3.org/2000/svg" width="720" height="620" viewBox="0 0 720 620" fill="none" aria-hidden="true">
  <!-- Traffic flows between the phones and the network -->
  <g stroke="#8fafc8" stroke-width="1" opacity=".38">
    <path d="M60 120 210 170 330 130M210 170 170 330 300 420M170 330 60 450 230 560M300 420 230 560" />
    <path d="M330 130 420 180M300 420 440 330M520 470 600 560M640 110 690 40" stroke-dasharray="4 9"/>
  </g>
  <g fill="#a9c3d4">
    <circle cx="60" cy="120" r="4"/><circle cx="210" cy="170" r="5"/><circle cx="330" cy="130" r="4"/>
    <circle cx="170" cy="330" r="5"/><circle cx="300" cy="420" r="5"/><circle cx="60" cy="450" r="4"/>
    <circle cx="230" cy="560" r="4"/><circle cx="600" cy="560" r="4"/><circle cx="690" cy="40" r="4"/>
  </g>
  <!-- Packets on the flows -->
  <g fill="#7fb7db">
    <circle cx="375" cy="155" r="3"/><circle cx="398" cy="168" r="2.5" opacity=".6"/>
    <circle cx="370" cy="375" r="3"/><circle cx="405" cy="352" r="2.5" opacity=".6"/>
    <circle cx="560" cy="515" r="3"/><circle cx="665" cy="75" r="2.5" opacity=".6"/>
    <circle cx="210" cy="170" r="9" opacity=".2"/><circle cx="300" cy="420" r="8" opacity=".24"/>
  </g>
  <!-- Main phone with a grid of apps -->
  <g transform="rotate(-8 500 230)" stroke="#8fafc8" stroke-width="1.6" opacity=".55">
    <rect x="425" y="70" width="150" height="300" rx="26"/>
    <rect x="437" y="104" width="126" height="232" rx="6" stroke-width="1"/>
    <path d="M482 86h36" stroke-linecap="round"/>
    <circle cx="500" cy="353" r="7" stroke-width="1"/>
    <g stroke-width="1">
      <rect x="449" y="118" width="26" height="26" rx="7"/><rect x="487" y="118" width="26" height="26" rx="7"/><rect x="525" y="118" width="26" height="26" rx="7"/>
      <rect x="449" y="156" width="26" height="26" rx="7"/><rect x="487" y="156" width="26" height="26" rx="7"/><rect x="525" y="156" width="26" height="26" rx="7"/>
      <rect x="449" y="194" width="26" height="26" rx="7"/><rect x="487" y="194" width="26" height="26" rx="7"/><rect x="525" y="194" width="26" height="26" rx="7"/>
      <rect x="449" y="232" width="26" height="26" rx="7"/><rect x="487" y="232" width="26" height="26" rx="7"/><rect x="525" y="232" width="26" height="26" rx="7"/>
    </g>
  </g>
  <g transform="rotate(-8 500 230)" fill="#7fb7db" opacity=".35">
    <rect x="487" y="156" width="26" height="26" rx="7"/><rect x="449" y="232" width="26" height="26" rx="7"/>
  </g>
  <!-- Second phone -->
  <g transform="rotate(9 610 410)" stroke="#8fafc8" stroke-width="1.4" opacity=".45">
    <rect x="555" y="300" width="110" height="220" rx="20"/>
    <rect x="565" y="326" width="90" height="168" rx="5" stroke-width="1"/>
    <path d="M592 313h36" stroke-linecap="round"/>
    <g stroke-width="1">
      <path d="M575 346h70M575 362h52M575 378h62"/>
      <rect x="575" y="398" width="70" height="56" rx="6"/>
      <path d="m602 414 16 12-16 12Z"/>
    </g>
  </g>
  <!-- Wi-Fi above the main phone -->
  <g stroke="#8fafc8" stroke-width="1.4" stroke-linecap="round" opacity=".45">
    <path d="M465 40a52 52 0 0 1 70 0M476 52a34 34 0 0 1 48 0M488 64a16 16 0 0 1 24 0"/>
  </g>
