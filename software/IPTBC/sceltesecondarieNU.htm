<html>

<head>
<title>Scelte Secondarie</title>
<SCRIPT LANGUAGE=javascript src=LayoutFunc.js></SCRIPT>
<base target="_self">
</head>

<body bgcolor="#C0C0C0">
<table border="1" width="97%" bgcolor="#C0C0C0"
style="line-height: 100%; border-style: solid" bordercolor="#C0C0C0" height="99">
  <tr>
    <td width="72%" align="center" height="18">
      <p align="right"><b>Minutes per Day on Phone&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
      <input type="text" size="5" color="buttonface" id="NMT"
      name="NumeroMinutiTelefono" value="90" onchange="aggiornamento()"></b></td>
  </tr>
  <tr>
    <td width="72%" align="center" height="17">
      <p align="right"><b>Busy Hour Factor (BHF)&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
      <input type="text" size="5" id="BHF" name="BusyHourFactor" value="0.17" onchange="aggiornamento()"></b></td>
  </tr>
  <tr>
    <td width="72%" align="center" height="17">
      <p align="right"><b>Blocking Probability&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
      <input type="text" size="5" id="BP" name="BlockingProbability"
      value="0.05" onchange="aggiornamento()"></b></td>
  </tr>
</table>
</body>
</html>
