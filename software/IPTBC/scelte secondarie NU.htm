<html>
<head>
<title>Scelte Secondarie</title>
<SCRIPT LANGUAGE=javascript src="LayoutFunc.js"></SCRIPT>
<base target="_self">
</head>

<body bgcolor="#C0C0C0">
<form action="" method=POST name=SSFormNU>
<table border="0" width="97%" bgcolor="#C0C0C0"
style="line-height: 100%; border-style: solid" bordercolor="#C0C0C0" cellspacing="0" cellpadding="0">

	<tr>
		<td width="85%" align="right">
			<b>Minutes per Day on Phone</b>
		</td>
		<td width="5%"> </td>
		<td>
			<input type="text" size="5" color="buttonface" id="NMT"
			name="NumeroMinutiTelefono" value="90" onchange="aggiornamento()">
		</td>
	</tr>
	<tr>
		<td width="85%" align="right">
 			<b>Busy Hour Factor (BHF)</b>
		</td>
		<td width="5%"> </td>
		<td>
			<input type="text" size="5" id="BHF" name="BusyHourFactor"
			value="0.17" onchange="aggiornamento()">
		</td>
	</tr>
	<tr>
		<td width="85%" align="right">
			<b>Blocking Probability</b>
		</td>
		<td width="5%"> </td>
		<td>
      		<input type="text" size="5" id="BP" name="BlockingProbability"
     		 value="0.05" onchange="aggiornamento()">
		</td>
	</tr>
</table>
</form>
</body>
</html>
